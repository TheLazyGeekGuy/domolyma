<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#292864" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <title>{{title}}</title>
    <link
      rel="icon"
      type="image/png"
      href="{{root}}assets/domolyma-logo-original.png"
    />
    <link rel="stylesheet" href="{{root}}assets/site.css" />
    <script defer src="{{root}}assets/site.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <header class="site-header">
      <a class="site-brand" href="{{root}}" aria-label="Domolyma — Accueil">
        <img
          src="{{root}}assets/domolyma-logo-original.png"
          alt="Domolyma"
          width="2172"
          height="724"
        />
      </a>
      <button
        class="menu-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-navigation"
        hidden
      >
        Menu <span aria-hidden="true">＋</span>
      </button>
      <nav id="site-navigation" aria-label="Navigation principale">
        <a href="{{root}}fonctionnalites/" {{current_features}}
          >Fonctionnalités</a
        >
        <a href="{{root}}projet/" {{current_project}}>Le projet</a>
        <a class="nav-demo" href="{{root}}demo/" {{current_demo}}
          >La démo <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    <main id="contenu">{{content}}</main>
    <footer class="site-footer">
      <div class="footer-top">
        <a class="site-brand" href="{{root}}" aria-label="Domolyma — Accueil"
          ><img
            src="{{root}}assets/domolyma-logo-original.png"
            alt="Domolyma"
            width="2172"
            height="724"
            loading="lazy"
        /></a>
        <p>Le dossier de vie de vos biens.</p>
      </div>
      <div class="footer-bottom">
        <p>Un projet en développement. Une copropriété mieux suivie.</p>
        <a href="{{root}}projet/#credits">Crédits et état du projet</a>
      </div>
    </footer>
  </body>
</html>
