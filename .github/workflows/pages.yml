name: Publish presentation and browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check source publication boundary
        run: python3 scripts/check-publication.py .
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build static presentation and autonomous demo
        run: npm run pages:build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Check publication boundary
        run: python3 scripts/check-publication.py dist/pages --artifact
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
